# Observability simulation for wire.
#
# Boots one coordinator + one worker, scrapes both with Prometheus, and
# auto-provisions a Grafana dashboard. A short-running load-generator
# container submits a few jobs after startup so the dashboards have data.
#
# From this directory:
#   docker compose up --build
#
# Then open:
#   - Grafana:    http://localhost:3000   (admin / admin)
#   - Prometheus: http://localhost:9091
#   - Coordinator API: http://localhost:4001
#
# To regenerate traffic without restarting:
#   docker compose run --rm load
#
# The load service is "profiles: load" so it doesn't auto-start with `up`.
# Use `docker compose --profile load up` to include it.

name: wire-observability

services:
  coordinator:
    build:
      # Build from the repo root so the Dockerfile can see go.mod etc.
      context: ../..
      dockerfile: examples/observability-stack/Dockerfile.wire
    image: wire:local
    container_name: wire-coordinator
    command:
      - "--mode=coordinator"
      - "--http-listen=:4001"
      - "--listen=:4002"
      - "--coordinator-data-dir=/data/coordinator"
      - "--election-backend=noop"
      - "--metrics-addr=:9090"
      - "--node-id=coordinator-1"
    ports:
      - "4001:4001"   # HTTP API
      - "4002:4002"   # RPC
      - "9090:9090"   # Prometheus scrape
    volumes:
      - coordinator-data:/data/coordinator
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4001/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s

  worker:
    # Same build context as coordinator so the layer cache is reused —
    # without this, compose would try to pull `wire:local` from a registry.
    build:
      context: ../..
      dockerfile: examples/observability-stack/Dockerfile.wire
    image: wire:local
    container_name: wire-worker
    # Override the entrypoint so we can run the example worker binary
    # which has the operator factories registered.
    entrypoint: /usr/local/bin/wire-worker-example
    command:
      - "--coordinator-addr=coordinator:4002"
      - "--worker-id=worker-1"
      - "--task-slots=4"
    depends_on:
      coordinator:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: wire-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # 9091 (host) → 9090 (container) so it doesn't collide with wire's own
      # /metrics endpoint published on host port 9090.
      - "9091:9090"
    depends_on:
      - coordinator

  grafana:
    image: grafana/grafana:11.3.0
    container_name: wire-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Short-running container that submits a few jobs so the dashboards have
  # data the moment you open Grafana. Started only when --profile load is
  # passed, or via `docker compose run --rm load`.
  load:
    build:
      context: ../..
      dockerfile: examples/observability-stack/Dockerfile.wire
    image: wire:local
    container_name: wire-load
    profiles: ["load"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for coordinator..."
        until curl -fsS http://coordinator:4001/healthz >/dev/null; do sleep 1; done
        echo "submitting jobs"
        for i in 1 2 3 4 5; do
          submit-uppercase-job \
            --coordinator-url http://coordinator:4001 \
            --message "hello-$$i" --message "wire-$$i" --message "obs-$$i" || true
          sleep 1
        done
        echo "done"
    depends_on:
      coordinator:
        condition: service_healthy

  # Init container: produces the static graph_bytes blob the k6 service
  # uses as its request body. Writes to a shared volume that the k6
  # service mounts read-only. Runs once per `up` (or `docker compose run`).
  k6-graph-init:
    image: wire:local
    container_name: wire-k6-graph-init
    profiles: ["k6"]
    entrypoint: ["sh", "-c"]
    command:
      - "print-uppercase-graph > /shared/graph_bytes.txt && echo wrote /shared/graph_bytes.txt"
    volumes:
      - k6-shared:/shared
    depends_on:
      coordinator:
        condition: service_healthy

  # k6 load generator. Reads GRAPH_BYTES from the shared volume produced
  # by k6-graph-init, then drives POST /api/v1/jobs at a configurable
  # arrival rate.
  #
  # Run with:
  #   docker compose --profile k6 run --rm k6
  # Override knobs:
  #   docker compose --profile k6 run --rm -e RPS=50 -e DURATION=1m k6
  k6:
    image: grafana/k6:0.54.0
    container_name: wire-k6
    profiles: ["k6"]
    depends_on:
      coordinator:
        condition: service_healthy
      k6-graph-init:
        condition: service_completed_successfully
    volumes:
      - ./k6:/scripts:ro
      - k6-shared:/shared:ro
    environment:
      WIRE_API: "http://coordinator:4001"
      RPS: "${RPS:-20}"
      DURATION: "${DURATION:-30s}"
    entrypoint: ["/bin/sh", "-c"]
    # The shell reads graph_bytes.txt and forwards it as a k6 --env so
    # the script's __ENV.GRAPH_BYTES sees it. The double-$$ escapes the
    # variable from compose's own interpolation.
    command:
      - 'k6 run --env GRAPH_BYTES=$$(cat /shared/graph_bytes.txt) /scripts/submit_jobs.js'

  # ----------------------------------------------------------------
  # CPU-intensive workload variant
  # ----------------------------------------------------------------
  # Same submit-path machinery as the k6 profile, but each job runs a
  # Source -> Map(cpu-burn) -> Sink pipeline that does configurable
  # SHA-256 work per event. Use this to populate the
  # wire_coordinator_job_duration_seconds histogram with realistic
  # values (seconds, not microseconds) and to observe end-to-end
  # in-system time under real CPU pressure.
  #
  # Run with:
  #   docker compose --profile k6-cpu run --rm k6-cpu
  # Tune the workload:
  #   BURN_ROUNDS=100000 BURN_EVENTS=200 \
  #     docker compose --profile k6-cpu run --rm k6-cpu

  k6-cpu-graph-init:
    image: wire:local
    container_name: wire-k6-cpu-graph-init
    profiles: ["k6-cpu"]
    entrypoint: ["sh", "-c"]
    environment:
      BURN_ROUNDS: "${BURN_ROUNDS:-50000}"
      BURN_EVENTS: "${BURN_EVENTS:-100}"
      BURN_PAYLOAD: "${BURN_PAYLOAD:-64}"
    command:
      - 'print-cpuburn-graph --rounds "$$BURN_ROUNDS" --events "$$BURN_EVENTS" --payload-bytes "$$BURN_PAYLOAD" > /shared/graph_bytes.txt && echo "wrote cpuburn graph (rounds=$$BURN_ROUNDS events=$$BURN_EVENTS payload=$$BURN_PAYLOAD)"'
    volumes:
      - k6-shared:/shared
    depends_on:
      coordinator:
        condition: service_healthy

  k6-cpu:
    image: grafana/k6:0.54.0
    container_name: wire-k6-cpu
    profiles: ["k6-cpu"]
    depends_on:
      worker:
        condition: service_started
      coordinator:
        condition: service_healthy
      k6-cpu-graph-init:
        condition: service_completed_successfully
    volumes:
      - ./k6:/scripts:ro
      - k6-shared:/shared:ro
    environment:
      WIRE_API: "http://coordinator:4001"
      # Default RPS is much lower than the upper-pipeline test because
      # each job now takes ~rounds * events * 500ns of CPU. At
      # rounds=50000 / events=100 / 4 task slots, the worker drains
      # ~1.6 jobs/s; submitting faster just queues CREATED.
      RPS: "${RPS:-2}"
      DURATION: "${DURATION:-2m}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'k6 run --env GRAPH_BYTES=$$(cat /shared/graph_bytes.txt) /scripts/submit_jobs.js'

volumes:
  coordinator-data:
  prometheus-data:
  grafana-data:
  k6-shared:
